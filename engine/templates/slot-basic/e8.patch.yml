# The delta on top of the e8-base bundle. Rewritten by the IDE on every
# edit — comments do not survive; see README.md.
rows:
  - id: renderer1
    config:
      background: '#10121a'
  - id: scenes1
    config:
      design:
        width: 480
        height: 288
      portrait:
        width: 288
        height: 480
  # The inner `config` is the reel system's own, not a typo — README.md.
  - id: reels1
    config:
      config:
        grid:
          cols: 5
          rows: 3
  - id: mechanics1
    config:
      stages:
        base_game: classic
  - id: playloop1
    config:
      skipEvents: [ui.skip, ui.tap]
  - id: shell1
    config:
      features:
        turbo: 1
        autoplay: {}
        buyBonus: false
      gameInfo:
        sections: []
