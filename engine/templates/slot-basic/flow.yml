version: 1
nodes:
  - { id: start, kind: boot,    ui: { x: 40,   y: 80 } }
  - { id: base,  kind: show,    props: { scene: base_game }, ui: { x: 220,  y: 80 } }
  - { id: idle,  kind: on,      props: { event: ui.spin },   ui: { x: 400,  y: 80 } }
  - { id: click, kind: sound,   props: { src: assets/spin.wav }, ui: { x: 580,  y: 80 } }
  - { id: spin,  kind: spin,    ui: { x: 760,  y: 80 } }
  - { id: draw,  kind: present, ui: { x: 940,  y: 80 } }
  - { id: show_win, kind: prop, props: { target: base_game/win, prop: text, value: '$result.win' }, ui: { x: 940,  y: 240 } }
  - { id: done,  kind: if,      props: { when: '$result.roundComplete' }, ui: { x: 1120, y: 80 } }
  - { id: step,  kind: step,    ui: { x: 1120, y: 240 } }
edges:
  - { from: start, to: base }
  - { from: base,  to: idle }
  - { from: idle,  to: click }
  - { from: click, to: spin }
  - { from: spin,  to: draw }
  - { from: draw,  to: show_win }
  - { from: show_win, to: done }
  - { from: done,  to: idle, out: 'true' }
  - { from: done,  to: step, out: 'false' }
  - { from: step,  to: draw }
