# The baseline row set every slot game composes from. Six of these eight
# packages used to be hardcoded into `createGame` (in
# `@energy8engine/game-runtime`) as static imports; they are rows now, and
# this file is where they live. The other two were never hardcoded
# anywhere — `spinlog1` is the "adding a seventh is an edit to a bundle"
# case, done; `diagnostics1` below is the same move again, for the shared
# service `createGame` now fills instead of only its own local array (see
# task-2-3-report.md).
# `@energy8engine/project`'s `resolveComposition` reads it (see
# `engine/ide/host/src/plugins/project.ts`, which resolves this bundle for
# any project whose `e8.profile.yml` lists `e8-base`), the host serves the
# result at `GET /api/composition`, and the browser's `createGame` applies
# each row's runtime half in this order. Nothing in the engine names these
# packages any more — replacing one, or adding a ninth, is an edit to a
# bundle or a patch.
#
# Rows carry no `config` here on purpose — this is the TEMPLATE, not any
# one game's settings. A project's own `e8.patch.yml` supplies the config
# each row actually needs (renderer size, reel grid, stage-mechanic
# binding, ...) by addressing these same row ids. See
# `engine/examples/first-slot/e8.patch.yml` for the reference patch, and
# task-8-report.md for which of `main.ts`'s current settings do — and do
# not — have a home in that patch.
rows:
  # The one shared destination for a diagnostic born once the game is
  # already running (a plan step, a post-spin check, a bridge's live
  # rebind), as well as everything `createGame` itself collects before the
  # first row even applies. FIRST in this list ON PURPOSE: every later
  # row — `boot1` included, which reports its own troubles the same as
  # anything else — needs to find `ctx.diagnostics` already there if it
  # wants to use it. `engine/game/runtime/tests/compose.test.ts` pins this
  # row's position against THIS FILE; do not rely on this comment alone to
  # keep it here.
  #
  # Optional, exactly like `spinlog1` below: nothing requires it, and a
  # composition that drops it plays exactly the same — every writer looks
  # the service up per call and does nothing when it isn't there (see
  # task-2-3-report.md). `GameApp.diagnostics` (createGame's own returned
  # field) is unaffected either way.
  - id: diagnostics1
    name: '@energy8engine/diagnostics'
  - id: boot1
    name: '@energy8engine/boot'
  - id: renderer1
    name: '@energy8engine/renderer-pixi'
  - id: scenes1
    name: '@energy8engine/scenes'
  # Animated pictures as scene nodes (`spritesheet`, `video`, `gif`).
  # `inject: ['nodeTypes']`, so it sits right after `scenes1`, which provides
  # that service; the row itself has no config.
  - id: media1
    name: '@energy8engine/node-media'
  # Spine skeletons as scene nodes (`spine`) — same shape as `media1`, its
  # own row so a project without Spine can drop the runtime.
  - id: spine1
    name: '@energy8engine/node-spine'
  # `symbols.yml` turned into the reel board's art: `assets.resolve` (the
  # `SymbolResolver` `reels1` reads off `ctx` AT ITS OWN APPLY TIME, with no
  # `inject` gating there — so THIS row must sit before `reels1` in the
  # list, not merely after `scenes1`/`media1`/`spine1`, whose node types it
  # mounts through) and the `symbols` service the Symbols document's canvas
  # previews through. `inject: []`, like `flow1`: `nodeTypes`/`assetLoader`/
  # `board` are all read leniently, at the moment each is actually needed,
  # so nothing else about this row's position is load-bearing the way
  # "before `reels1`" is.
  - id: symbols1
    name: '@energy8engine/symbols'
  - id: reels1
    name: '@energy8engine/reels'
  - id: mechanics1
    name: '@energy8engine/game-runtime'
  - id: playloop1
    name: '@energy8engine/play-loop'
  # The flow document that drives the play loop end to end (boot → spin →
  # present → …), edited in the IDE's flow editor. `inject: []` (see
  # `@energy8engine/flow`'s `src/runtime.ts`), so its position here is not
  # load-bearing the way `scenes1`/`playloop1`'s is — it reaches
  # `scenes`/`mechanics`/`play`/`board` leniently, per node, at run time.
  - id: flow1
    name: '@energy8engine/flow'
  # The durable record of what happened, as opposed to the live events of
  # what is shown (§7 of the spec). Baseline rather than per-project
  # because of the note that spec attaches to it: a log added later is a
  # log of everything after it was added.
  #
  # Nothing requires this row. Drop it from a profile's stack, or
  # `remove: true` it in a patch, and the game plays exactly as before
  # keeping no record — `@energy8engine/play-loop`'s `record()` looks the
  # service up per call and does nothing when it isn't there.
  - id: spinlog1
    name: '@energy8engine/spin-log'
