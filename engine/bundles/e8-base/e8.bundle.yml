# The baseline row set every slot game composes from. The first handful of
# these packages used to be hardcoded into `createGame` (in
# `@energy8engine/game-runtime`) as static imports; they are rows now, and
# this file is where they live. The rest were never hardcoded anywhere —
# each one (`spinlog1`, `diagnostics1`, the session/scene/node rows, the
# reel rows `motion1`/`anticipation1`/`cascade1`, ...) is the "adding a row
# is an edit to a bundle" case, done (see task-2-3-report.md for
# `diagnostics1`, the shared service `createGame` now fills instead of only
# its own local array).
# `@energy8engine/project`'s `resolveComposition` reads it (see
# `engine/ide/host/src/plugins/project.ts`, which resolves this bundle for
# any project whose `e8.profile.yml` lists `e8-base`), the host serves the
# result at `GET /api/composition`, and the browser's `createGame` applies
# each row's runtime half in this order. Nothing in the engine names these
# packages any more — replacing one, or adding another, is an edit to a
# bundle or a patch.
#
# Rows carry no `config` here on purpose — this is the TEMPLATE, not any
# one game's settings. A project's own `e8.patch.yml` supplies the config
# each row actually needs (renderer size, reel grid, stage-mechanic
# binding, ...) by addressing these same row ids. See
# `engine/examples/first-slot/e8.patch.yml` for the reference patch, and
# task-8-report.md for which of `main.ts`'s current settings do — and do
# not — have a home in that patch.
rows:
  # The one shared destination for a diagnostic born once the game is
  # already running (a plan step, a post-spin check, a bridge's live
  # rebind), as well as everything `createGame` itself collects before the
  # first row even applies. FIRST in this list ON PURPOSE: every later
  # row — `boot1` included, which reports its own troubles the same as
  # anything else — needs to find `ctx.diagnostics` already there if it
  # wants to use it. `engine/game/runtime/tests/compose.test.ts` pins this
  # row's position against THIS FILE; do not rely on this comment alone to
  # keep it here.
  #
  # Optional, exactly like `spinlog1` below: nothing requires it, and a
  # composition that drops it plays exactly the same — every writer looks
  # the service up per call and does nothing when it isn't there (see
  # task-2-3-report.md). `GameApp.diagnostics` (createGame's own returned
  # field) is unaffected either way.
  - id: diagnostics1
    name: '@energy8engine/diagnostics'
  - id: boot1
    name: '@energy8engine/boot'
  - id: renderer1
    name: '@energy8engine/renderer-pixi'
  # The `session` seam (spec §3): two candidates, one winner per
  # composition. `sessionhost1` (`default: true`) is the dev host's own
  # `GET /api/session` / `POST /api/spin`; `sessionsdk1` (`buildTarget:
  # 'platform'`) is the Energy8 platform SDK. `@energy8engine/seam` picks
  # one per `buildTarget`/`urlParam`/`default`, and `createGame` keeps that
  # one per `buildTarget` and drops the other before it is even imported.
  # Both are listed here so the slot is where it belongs whichever wins —
  # the winner takes the losing candidate's position (see `createGame`).
  - id: sessionhost1
    name: '@energy8engine/session-host'
  - id: sessionsdk1
    name: '@energy8engine/session-sdk'
  - id: scenes1
    name: '@energy8engine/scenes'
  # Animated pictures as scene nodes (`spritesheet`, `video`, `gif`).
  # `inject: ['nodeTypes']`, so it sits right after `scenes1`, which provides
  # that service; the row itself has no config.
  - id: media1
    name: '@energy8engine/node-media'
  # Spine skeletons as scene nodes (`spine`) — same shape as `media1`, its
  # own row so a project without Spine can drop the runtime.
  - id: spine1
    name: '@energy8engine/node-spine'
  # `symbols.yml` turned into the reel board's art: `assets.resolve` (the
  # `SymbolResolver` `reels1` reads off `ctx` AT ITS OWN APPLY TIME, with no
  # `inject` gating there — so THIS row must sit before `reels1` in the
  # list, not merely after `scenes1`/`media1`/`spine1`, whose node types it
  # mounts through) and the `symbols` service the Symbols document's canvas
  # previews through. `inject: []`, like `flow1`: `nodeTypes`/`assetLoader`/
  # `board` are all read leniently, at the moment each is actually needed,
  # so nothing else about this row's position is load-bearing the way
  # "before `reels1`" is.
  - id: symbols1
    name: '@energy8engine/symbols'
  - id: reels1
    name: '@energy8engine/reels'
  # How the reels spin: registers the three built-in motion styles (`swap`,
  # `strip`, `cascade-drop`) into `reels1`'s `reels` service and activates the
  # one its `style` names (default `swap`). Without this row a spin snaps
  # straight to the result, and `reels1` says so as a warning. It reaches
  # `reels` through `ctx.inject(['reels'], ...)` — re-run on every hot
  # re-apply of `reels1` — so its place in this list is NOT load-bearing;
  # it sits right after `reels1` only so the reel rows read as one group.
  - id: motion1
    name: '@energy8engine/reels-motion'
  # The anticipator (`reels.anticipation`): which trailing reels slow down
  # when enough trigger symbols have already landed. With no config it is
  # composed but OFF (`enabled: false`) — a project turns it on in its patch.
  # Same `ctx.inject(['reels'], ...)` as `motion1`, so the same "order is
  # not load-bearing" holds.
  - id: anticipation1
    name: '@energy8engine/reels-anticipation'
  # The cascade family: the `tumble` board controller (`reels` delegates a
  # tumble step to it, and fails that step without this row) and the
  # `reelStep` step handler, into `playloop1`'s `steps`. The row being here
  # IS the cascade switch — its config has no `enabled`. Both registrations
  # go through `ctx.inject` (`['reels']`, `['steps']`), so it composes before
  # `playloop1` just as well as after it; list order is not load-bearing.
  - id: cascade1
    name: '@energy8engine/reels-cascade'
  - id: mechanics1
    name: '@energy8engine/game-runtime'
  - id: playloop1
    name: '@energy8engine/play-loop'
  # The Pixi shell (bar, bet ladder, balance, win, turbo, autoplay, menu)
  # as a row the flow drives and listens to — the `ui.shell` seam (spec
  # §4). `inject: ['renderer', 'session']`, so it waits for both whatever
  # its place here; a page that must not draw it composes with
  # `createGame({ without: ['ui.shell'] })` (the scene editor does).
  - id: shell1
    name: '@energy8engine/shell-pixi'
  # `tween`/`sound` flow node kinds — moving a scene node through the
  # legacy `Tween`, playing a file through `@pixi/sound`. `inject:
  # ['flowNodes']`, so this row stays PENDING until `flow1` (below) provides
  # that service — list order does not decide when it applies, cordis's
  # inject wait does. It is listed BEFORE `flow1` on purpose anyway: rows
  # apply in order, one `await importModule(...)` at a time (`@energy8engine/
  # loader`'s `composeFromProject`), so listing it first means ITS module —
  # heavier than `flow1`'s (it pulls in pixi + `@pixi/sound`) — finishes
  # importing before `flow1`'s import even starts, and so well before
  # `flow1`'s apply fires the `/api/flow` boot GET. Once `flow1` provides
  # `flowNodes`, cordis wakes this already-imported, already-pending row at
  # once, registering `tween`/`sound` before that GET's response can land.
  # Listed the other way around (as it used to be), a slow import of THIS
  # row could still be in flight when the GET resolves, and `flow1`'s
  # `replace()` would validate against a registry missing `tween`/`sound` —
  # the race task 9's browser proof caught (`unknown kind 'sound'`). See
  # `@energy8engine/flow`'s `interpreter.ts` `createFlow` for the other half
  # of the fix: a doc that loses that race is not stuck forever either.
  - id: fx1
    name: '@energy8engine/flow-fx'
  # The flow document that drives the play loop end to end (boot → spin →
  # present → …), edited in the IDE's flow editor. `inject: []` (see
  # `@energy8engine/flow`'s `src/runtime.ts`), so its position here is not
  # load-bearing the way `scenes1`/`playloop1`'s is — it reaches
  # `scenes`/`mechanics`/`play`/`board` leniently, per node, at run time.
  # Listed AFTER `fx1` on purpose now — see that row's comment above.
  - id: flow1
    name: '@energy8engine/flow'
  # The durable record of what happened, as opposed to the live events of
  # what is shown (§7 of the spec). Baseline rather than per-project
  # because of the note that spec attaches to it: a log added later is a
  # log of everything after it was added.
  #
  # Nothing requires this row. Drop it from a profile's stack, or
  # `remove: true` it in a patch, and the game plays exactly as before
  # keeping no record — `@energy8engine/play-loop`'s `record()` looks the
  # service up per call and does nothing when it isn't there.
  - id: spinlog1
    name: '@energy8engine/spin-log'
