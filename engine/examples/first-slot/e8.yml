# Composition entries for the IDE editor (probe plugins, panels, ...) — the
# same format engine/examples/workspace/e8.yml uses. `@energy8engine/ide-bridge`
# is the one entry Task 12's SDD plan gives first-slot: registered here so
# the composition screen renders a row with `stage` and `mechanic` fields
# (schema-driven, same as `e8-example-probe`'s "скорость барабана"). The
# ide-host's own `ctx.loader` composes this entry HOST-SIDE, where
# `ide-bridge` is an honest no-op (see its own module doc) — its real job
# happens BROWSER-SIDE, composed directly into the running game by
# src/main.ts, which listens on the SAME `/ide` websocket this row's edits
# travel over and rebinds the mechanic live.
#
# No values here on purpose: `e8.patch.yml` decides what renders the stage,
# and this row exists so a human can OVERRIDE that live. A value written
# here is pushed over the patch's binding on the first snapshot after boot,
# so both fields start empty — and an empty `stage` means "the one stage
# this composition binds", which is all first-slot has. (Keep notes like
# this short — the IDE rewrites this file on every edit and does not
# preserve comments.)
- id: bridge1
  name: '@energy8engine/ide-bridge'
  config: {}
# `screen-demo` (`plugins/screen-demo/` in this project) belongs here and
# not in `e8.patch.yml`: this file is what `ctx.loader`/`ctx.composition`
# on the host resolves, and only ITS rows get a `clientUrl` broadcast over
# `/ide` for the IDE's `modules.ts` to fetch and `apply(ctx)` — the GAME's
# own composition (`e8.profile.yml` + `e8.patch.yml`) is a separate
# service on purpose (see `engine/ide/host/src/index.ts`'s own comment)
# and never reaches the browser tab that has the editor open. A screen is
# exactly this kind of entry: it draws into the EDITOR, the same as
# `bridge1` above, not into the running game.
- id: screendemo1
  name: screen-demo
  config: {}
