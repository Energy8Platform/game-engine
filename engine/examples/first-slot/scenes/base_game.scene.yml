id: base_game
nodes:
  - id: board
    type: reels
    props: { row: reels1 }
  - id: logo
    type: image
    props: { src: assets/logo.png, x: 240, y: 40, anchor: 0.5 }
  - id: coin
    type: spritesheet
    props: { sheet: assets/coin.json, x: 40, y: 40, fps: 8, anchor: 0.5 }
  - id: win
    type: text
    props: { text: '', size: 28, fill: '#ffd166', pin: bottom, x: 0, y: -24, anchor: 0.5, align: center }
  - id: big_win
    type: scene
    props: { scene: big_win, visible: false }
portrait:
  nodes:
    logo: { pin: top, x: 0, y: 40 }
    board: { pin: top, x: -112, y: 115, scale: 0.55 }
    coin: { visible: false }
